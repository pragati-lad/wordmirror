databases:
  - name: wordmirror-db
    plan: free
    databaseName: wordmirror
    user: wordmirror

services:
  - type: web
    name: wordmirror
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wordmirror-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.0"
