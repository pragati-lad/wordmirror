{% extends "base.html" %}

{% block title %}Sign Up - WordMirror{% endblock %}

{% block content %}
<div class="auth-page">
    <h1>Create Your Account</h1>
    <p class="auth-subtitle">Start building your vocabulary today</p>

    <!--
        This form sends a POST request to /register when submitted.
        Each <input> has a "name" attribute — that's the key Flask uses
        to read the value with request.form.get("name").
    -->
    <form method="POST" action="{{ url_for('register') }}" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Your name"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="At least 6 characters"
                minlength="6"
                required
            >
        </div>

        <div class="form-group">
            <label for="confirm">Confirm Password</label>
            <input
                type="password"
                id="confirm"
                name="confirm"
                placeholder="Type your password again"
                required
            >
        </div>

        <button type="submit" class="btn btn-primary btn-full">Sign Up</button>
    </form>

    <p class="auth-switch">
        Already have an account? <a href="{{ url_for('login') }}">Log in</a>
    </p>
</div>
{% endblock %}
